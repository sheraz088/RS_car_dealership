<!DOCTYPE html>
<html>
  <head>
    <title>Registration</title>

    <link rel="stylesheet" href="../assets/css/registration.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="form-title">Registration</h1>
      <form action="registrationphp.php" method="post">
        <div class="main-user-info">

          <div class="user-input-box">

                 <input type="text" placeholder="Enter Full Name"  name="fullname" id="30"/>

          </div>
          <div class="user-input-box">

                <input type="text"  name="username" placeholder="Enter Username" id="30"/>

          </div>

          <div class="user-input-box">

                <input type="email"   name="email" placeholder="Enter Email" id="30"/>

          </div>
          <div class="user-input-box">

                <input type="text"   name="phoneNumber"  placeholder="Enter Phone Number" id="30"/>

          </div>
          <div class="user-input-box">

             <input type="password"   name="password"  placeholder="Enter Password" id="30"/>

          </div>
            <div class="user-input-box">

             <input type="date" placeholder="Date of birth" name="dob" id="20">

             </div>
        </div>
        <div class="gender-details-box"> 
            <span class="gender-title">Gender</span>
                <div class="gender-category">
                         <input type="radio" name="gender" id="male">
                         <label for="male">Male</label>
                         <input type="radio" name="gender" id="female">
                         <label for="female">Female</label>
                </div>
        </div>
        <div class="form-submit-btn">
          <input type="submit" value="Register">
        </div>
      </form>
    </div>
  </body>
</html>
